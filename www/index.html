<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="سجل الدروس"><meta name="theme-color" content="#0b7d8a"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل الدروس الخصوصية</title>
<style>
:root{--bg:#f1f4f7;--card:#fff;--tx:#16212b;--mu:#6b7785;--ac:#0b7d8a;--ln:#e5e9ed;--ok:#dff3e8;--okt:#17794a;--no:#fde7e7;--not:#b3261e;--pd:#fff0c2;--pdt:#6a4f00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1115;--card:#151d23;--tx:#e9eff3;--mu:#8b9aa6;--ac:#43bfcb;--ln:#25323b;--ok:#17402f;--okt:#7be0a8;--no:#4a2326;--not:#ff9b94;--pd:#4f4012;--pdt:#ffe9a8}}
:root[data-theme="dark"]{--bg:#0b1115;--card:#151d23;--tx:#e9eff3;--mu:#8b9aa6;--ac:#43bfcb;--ln:#25323b;--ok:#17402f;--okt:#7be0a8;--no:#4a2326;--not:#ff9b94;--pd:#4f4012;--pdt:#ffe9a8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Arabic","SF Pro Text",system-ui,"Segoe UI",Tahoma,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
#app{max-width:560px;margin:0 auto;padding:10px max(12px,env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
h1{font-size:20px;margin:2px 2px 10px;font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;height:36px;padding:0 14px;border-radius:18px;background:var(--card);font-size:14px;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.tab.on{background:var(--ac);color:#fff;box-shadow:0 3px 10px rgba(11,125,138,.3)}
.tab.add{color:var(--ac);background:none;box-shadow:none;border:1px dashed var(--ln)}
.tb{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.tb .sm,select.mf{height:36px;padding:0 12px;border-radius:12px;background:var(--card);border:0;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.07)}
select.mf{flex:1;min-width:0}
.card{background:var(--card);border-radius:16px;padding:4px 14px 8px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0 4px}
.nm{background:none;font-weight:700;font-size:15px;padding:4px 0;text-align:start}
.ch>span{display:flex;gap:6px;align-items:center}
.r{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--ln)}
.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{width:62px;height:36px;border-radius:18px;background:var(--bg);color:var(--mu);font-size:13px;font-weight:700}
.st.p{background:var(--ok);color:var(--okt)}.st.a{background:var(--no);color:var(--not)}
.pay,.mx{height:36px;min-width:72px;padding:0 10px;border-radius:18px;border:1px solid var(--ln);font-size:13px;color:var(--mu)}
.pay.on{background:var(--ok);color:var(--okt);border-color:transparent;font-weight:700}
.mx{height:30px;min-width:0;font-size:12px}.mx.on{background:var(--pd);color:var(--pdt);border-color:transparent;font-weight:700}
.x{font-size:16px;width:34px;height:30px;border-radius:8px;color:var(--mu)}
.tag{font-size:12.5px;color:var(--mu)}
.stat{display:flex;gap:14px;flex-wrap:wrap;padding:2px 0 8px;font-size:14px;color:var(--mu)}.stat b{color:var(--tx)}
.due{color:var(--not);font-weight:700}.fine{color:var(--okt);font-weight:700}
.acts{display:flex;gap:6px;border-top:1px solid var(--ln);padding-top:8px}
.acts .sm{flex:1;height:36px;border-radius:10px;background:var(--bg);font-size:13.5px;font-weight:500}
.list button{display:block;width:100%;text-align:start;padding:13px 2px;font-size:15px;border-top:1px solid var(--ln)}
.list button:first-child{border-top:0}.list .rd{color:var(--not)}
.empty{color:var(--mu);text-align:center;padding:36px 10px}
.btn{min-height:44px;padding:0 18px;border-radius:12px;background:var(--ac);color:#fff;font-weight:700}
.btn.alt{background:var(--bg);color:var(--tx);font-weight:500}.btn.red{background:#c0392b}
.warn{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--pd);color:var(--pdt);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:13.5px}
.warn .btn{min-height:34px;padding:0 12px;font-size:13px}
.bar2{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.bar2 button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--mu);padding:4px 0}
.bar2 button i{font-style:normal;font-size:20px;line-height:1.2}.bar2 button.on{color:var(--ac);font-weight:700}
.fab{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:calc(76px + env(safe-area-inset-bottom));z-index:21;width:56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(11,125,138,.45)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.md{background:var(--card);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
.md h2{margin:0 0 10px;font-size:18px}
.md label{display:block;font-size:13.5px;color:var(--mu);margin:10px 0 4px}
.md input,.md select,.md textarea{width:100%;min-height:44px;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);font-size:16px}
.md textarea{height:140px;direction:ltr;font-size:12px}
.md .row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.md .row .btn{flex:1;min-width:104px}
.dt{display:flex;gap:6px}.dt select{flex:1;min-width:0}
.wrap{overflow:auto;border:1px solid var(--ln);border-radius:12px}
table{border-collapse:collapse;width:100%}th,td{padding:8px;text-align:center;border-bottom:1px solid var(--ln)}
td.ok{background:var(--ok)}td.no{background:var(--no)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media (min-width:600px){.ov{align-items:center;padding:16px}.md{border-radius:20px}}
@page{margin:0}
@media print{#app,.bar2,.fab{display:none}html,body{height:auto;overflow:visible;background:#fff!important}.ov{position:static;display:block;background:none;padding:0;overflow:visible}.md{max-width:none;max-height:none;overflow:visible;padding:16mm;background:#fff;color:#000;border-radius:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}.md .wrap{max-height:none!important;overflow:visible!important;border:0}.md th,.md td{background:#fff!important;color:#000!important}.md td.ok{background:#d6f1e1!important}.md td.no{background:#fbdada!important}.row,.md textarea,.md label,.md select{display:none}.md .im,.md small{color:#333!important}.md .sum .tt{background:none}tr{break-inside:avoid}thead{display:table-header-group}}
.ih{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ac);padding-bottom:8px;margin-bottom:6px}.ih b{font-size:20px;color:var(--ac)}.ih span{color:var(--mu);font-size:13px}
.im{font-size:13.5px;color:var(--mu);margin:6px 0;line-height:1.7}
.sum{margin-top:10px}.sum div{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--ln)}.sum .tt{font-size:17px;font-weight:700;background:var(--bg);padding:9px 8px;border-radius:8px;border:0}
.stamp{margin:12px auto 0;width:max-content;border:3px solid var(--okt);color:var(--okt);font-weight:700;padding:4px 16px;border-radius:10px;transform:rotate(-4deg)}
.nt{font-size:13px;color:var(--mu);padding:0 0 6px}
th small,td small{color:var(--mu);font-size:11.5px}
.card.off{opacity:.55}.bd{font-size:11.5px;padding:2px 8px;border-radius:10px;background:var(--pd);color:var(--pdt);margin-inline-start:8px}.bd.x{background:var(--no);color:var(--not)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const K='tutor-tracker-v1';
let S={classes:[],cur:null};
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function save(){S.ts=Date.now();lsSet(K,JSON.stringify(S))}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const fileName=()=>'tutor-backup-'+today()+'.json';
const stamp=()=>lsSet('tt-lb',String(Date.now()));
function dlFile(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=fileName();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);stamp()}
async function shareFile(){const f=new File([JSON.stringify(S)],fileName(),{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});stamp()}catch(e){}}else dlFile()}
function bk(){if(!S.classes.length)return'';const t=+lsGet('tt-lb')||0,days=(Date.now()-t)/864e5;if(t&&days<7)return'';return`<div class="warn">${t?'مضى على آخر نسخة احتياطية '+Math.floor(days)+' أيام.':'لم تأخذ نسخة احتياطية بعد.'} <button class="btn" data-a="export">صدّر الآن</button></div>`}
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C=()=>S.classes.find(c=>c.id===S.cur);
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const fmt=d=>{const t=new Date(d+'T12:00:00');return DN[t.getDay()]+' '+t.getDate()+' '+MN[t.getMonth()]+' '+t.getFullYear()};
function dateForm(v){const[y,m,d]=v.split('-').map(Number);const yr=new Date().getFullYear();
let o='<div class="dt"><select id="d1" aria-label="اليوم">';for(let i=1;i<=31;i++)o+=`<option ${i===d?'selected':''}>${i}</option>`;
o+='</select><select id="d2" aria-label="الشهر">'+MN.map((n,i)=>`<option value="${i+1}" ${i+1===m?'selected':''}>${n}</option>`).join('')+'</select><select id="d3" aria-label="السنة">';
for(let i=yr-2;i<=yr+1;i++)o+=`<option ${i===y?'selected':''}>${i}</option>`;return o+'</select></div>'}
function getDate(){const d=+$('d1').value,m=+$('d2').value,y=+$('d3').value;const t=new Date(y,m-1,d);if(t.getMonth()!==m-1){alert('التاريخ غير صحيح');return null}return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function mfSel(c){const ms=[...new Set(c.dates.map(d=>d.slice(0,7)))].sort().reverse();if(!ms.length)return'';
return'<select class="mf" data-m="1" aria-label="الشهر"><option value="all">كل الأشهر</option>'+ms.map(m=>`<option value="${m}" ${S.month===m?'selected':''}>${MN[+m.slice(5)-1]} ${m.slice(0,4)}</option>`).join('')+'</select>'}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const $=id=>document.getElementById(id);

const R3=x=>Math.round(x*1000)/1000;
const fd=d=>{const t=new Date(d+'T12:00:00');return t.getDate()+' '+MN[t.getMonth()]+' '+t.getFullYear()};
const snap=()=>lsSet('tt-prev',JSON.stringify(S));
function alloc(c,s,end){
 const pr=+s.price||5;
 let credit=R3((s.pays||[]).filter(p=>!p.date||p.date<=end).reduce((a,p)=>a+(+p.amt||0),0));
 const rows=c.dates.filter(d=>d<=end&&!(c.status&&c.status[d]==='x')&&c.att[d+'|'+s.id]==='p').sort().map(d=>{const cost=pr*(c.mult&&c.mult[d]===2?2:1),flag=!!c.paid[d+'|'+s.id];return{d,cost,flag,cov:0,rem:flag?0:cost}});
 rows.forEach(r=>{if(!r.flag&&credit>0){const u=Math.min(credit,r.cost);r.cov=u;r.rem=R3(r.cost-u);credit=R3(credit-u)}});
 return{rows,adv:credit,due:R3(rows.reduce((a,r)=>a+r.rem,0))};
}
function stats(c,s,ds){
 let p=0,ab=0;ds.forEach(d=>{if(c.status&&c.status[d]==='x')return;const a=c.att[d+'|'+s.id];if(a==='p')p++;if(a==='a')ab++});
 const a=alloc(c,s,'9999-12-31');
 return{p,ab,n:a.rows.filter(r=>r.rem>0).length,amt:a.due,adv:a.adv};
}
function paysModal(c,s){
 const list=(s.pays||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 const body=(list.length?list.map(p=>`<div class="r"><span class="n">${p.date?fd(p.date):'بدون تاريخ'}${p.note?' · '+esc(p.note):''}</span><b>${p.amt} ر.ع</b><button class="x" data-a="delpay" data-s="${s.id}" data-p="${p.id}" aria-label="حذف الدفعة">🗑</button></div>`).join(''):'<p class="empty" style="padding:12px">لا توجد دفعات مسجلة.</p>')+'<label>مبلغ دفعة جديدة (ر.ع)</label><input id="f1" type="number" inputmode="decimal" min="0" step="0.5"><label>تاريخ الدفع</label>'+dateForm(today())+'<label>ملاحظة (اختياري)</label><input id="f2">';
 modal('دفعات '+esc(s.name),body,[{t:'إضافة الدفعة',f:()=>{const amt=+$('f1').value;if(!(amt>0)){alert('أدخل مبلغًا صحيحًا');return false}const dv=getDate();if(!dv)return false;s.pays=s.pays||[];s.pays.push({id:uid(),amt:R3(amt),date:dv,note:$('f2').value.trim()});save();render()}},{t:'إغلاق',c:'alt'}]);
}
function wa(s,txt){let p=(s.phone||'').replace(/\D/g,'');if(!p){alert('أضف رقم ولي الأمر من «تعديل» الطالب');return}if(p.startsWith('00'))p=p.slice(2);else if(p.startsWith('0'))p=p.slice(1);if(p.length===8)p='968'+p;const a=document.createElement('a');a.href='https://wa.me/'+p+'?text='+encodeURIComponent(txt);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
function summ(c){const all=!S.month||S.month==='all',start=all?'0000-00-00':S.month+'-01',end=all?'9999-12-31':S.month+'-31';let tot=0,rem=0,prev=0,adv=0;c.students.forEach(s=>{const a=alloc(c,s,end);a.rows.forEach(r=>{if(r.d>=start){tot+=r.cost;rem+=r.rem}else prev+=r.rem});adv+=a.adv});
 const label=all?'كل الفترة':MN[+S.month.slice(5)-1]+' '+S.month.slice(0,4);
 return`<section class="card"><div class="ch"><b>ملخص ${label}</b></div><div class="stat"><span>الإجمالي <b>${R3(tot)}</b></span><span>المحصّل <b>${R3(tot-rem)}</b></span><span class="${rem?'due':'fine'}">المتبقي ${R3(rem)}</span>${prev?`<span class="due">مستحق سابق ${R3(prev)}</span>`:''}${adv?`<span class="fine">مقدّم ${R3(adv)}</span>`:''}</div></section>`}
function invoice(c,s){
 const owner=S.owner||'خالد البادي',idx=c.students.findIndex(x=>x.id===s.id)+1;
 const cm=today().slice(0,7),months=[...new Set([...c.dates.map(d=>d.slice(0,7)),cm])].sort().reverse();
 const mname=m=>MN[+m.slice(5)-1]+' '+m.slice(0,4);
 const no=today().replace(/-/g,'')+'-'+String(idx).padStart(2,'0');
 let cur=null;
 function build(per){
  const all=per==='all',start=all?'0000-00-00':per+'-01',end=all?'9999-12-31':per+'-31';
  const a=alloc(c,s,end),pr=a.rows.filter(r=>r.d>=start);
  const prev=R3(a.rows.filter(r=>r.d<start).reduce((x,r)=>x+r.rem,0));
  const tot=R3(pr.reduce((x,r)=>x+r.cost,0)),rem=R3(pr.reduce((x,r)=>x+r.rem,0));
  const due=R3(prev+rem),paid=R3(tot-rem);
  const pays=(s.pays||[]).filter(p=>p.date?(p.date>=start&&p.date<=end):all).sort((x,y)=>(x.date||'').localeCompare(y.date||''));
  const label=all?'كل الحصص حتى اليوم':mname(per);
  const two=d=>c.mult&&c.mult[d]===2;
  const st=r=>r.flag?'مدفوع':r.rem===0?'مغطّى بدفعة':r.cov>0?'جزئي (متبقي '+r.rem+')':'غير مدفوع';
  const pdt=r=>r.flag&&c.pd&&c.pd[r.d+'|'+s.id]?fd(c.pd[r.d+'|'+s.id]):'—';
  const sum=[['إجمالي حصص الفترة ('+pr.length+')',tot+' ر.ع']];
  if(prev>0)sum.push(['مستحقات سابقة',prev+' ر.ع']);
  sum.push(['المدفوع عن حصص الفترة',paid+' ر.ع']);
  sum.push(['المطلوب الآن',due+' ر.ع']);
  if(a.adv>0)sum.push(['رصيد مقدّم لصالح الطالب',a.adv+' ر.ع']);
  const txt=[owner+' — فاتورة دروس خصوصية','رقم الفاتورة: '+no,'تاريخ الإصدار: '+fd(today()),'الطالب: '+s.name+' · '+c.name,'الفترة: '+label,'',...pr.map(r=>'• '+fd(r.d)+(two(r.d)?' (ساعتان)':'')+' — '+r.cost+' ر.ع — '+st(r)+(r.flag&&pdt(r)!=='—'?' ('+pdt(r)+')':'')),...(pays.length?['','الدفعات المسجلة:',...pays.map(p=>'- '+(p.date?fd(p.date):'بدون تاريخ')+': '+p.amt+' ر.ع')]:[]),'',...sum.map(r=>r[0]+': '+r[1]),...(due===0&&pr.length?['','✓ مدفوع بالكامل']:[])].join('\n');
  const html=`<div class="inv"><div class="ih"><b>${esc(owner)}</b><span>دروس خصوصية</span></div><div class="im">فاتورة رقم ${no} · تاريخ الإصدار ${fd(today())}</div><div class="im">الطالب: <b>${esc(s.name)}</b> · ${esc(c.name)}<br>الفترة: ${label}</div>`+(pr.length?'<div class="wrap" style="max-height:32vh"><table><thead><tr><th>التاريخ</th><th>المبلغ</th><th>الحالة</th><th>تاريخ الدفع</th></tr></thead><tbody>'+pr.map(r=>`<tr><td>${fd(r.d)}<br><small>${two(r.d)?'ساعتان':'ساعة'}</small></td><td>${r.cost}</td><td class="${r.rem===0?'ok':'no'}">${st(r)}</td><td>${pdt(r)}</td></tr>`).join('')+'</tbody></table></div>':'<p class="empty" style="padding:14px">لا توجد حصص حضرها الطالب في هذه الفترة.</p>')+(pays.length?'<p class="im"><b>الدفعات المسجلة:</b><br>'+pays.map(p=>(p.date?fd(p.date):'بدون تاريخ')+' — '+p.amt+' ر.ع'+(p.note?' ('+esc(p.note)+')':'')).join('<br>')+'</p>':'')+'<div class="sum">'+sum.map(r=>`<div class="${r[0]==='المطلوب الآن'?'tt':''}"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')+'</div>'+(due===0&&pr.length?'<div class="stamp">مدفوع بالكامل ✓</div>':'')+'</div>';
  return{html,txt,pr,pays,sum,due,label,no,pdt,st,two};
 }
 const per0=(S.month&&S.month!=='all'&&months.includes(S.month))?S.month:cm;
 cur=build(per0);
 const img=async()=>{

    modal('دفع شهر كامل — '+esc(s.name),'<label>الشهر</label><select id="f1">'+ms.map(m=>'<option value="'+m+'"'+(m===sel?' selected':'')+'>'+MN[+m.slice(5)-1]+' '+m.slice(0,4)+'</option>').join('')+'</select><p id="pmi"></p><label>تاريخ الدفع</label>'+dateForm(today())+'<p style="color:var(--mu);font-size:13px">يُعلَّم فقط ما حضره الطالب من حصص ذلك الشهر.</p>',[{t:'تعليم الشهر مدفوعًا',f:()=>{const m=$('f1').value;const dv=getDate();if(!dv)return false;c.pd=c.pd||{};c.dates.filter(d=>d.slice(0,7)===m&&c.att[d+'|'+s.id]==='p').forEach(d=>{c.paid[d+'|'+s.id]=1;if(!c.pd[d+'|'+s.id])c.pd[d+'|'+s.id]=dv});save();render()}},{t:'إلغاء الدفع للشهر',c:'alt',f:()=>{const m=$('f1').value;modal('تأكيد','<p>إلغاء تعليم الدفع لكل حصص هذا الشهر لـ '+esc(s.name)+'؟</p>',[{t:'لا',c:'alt'},{t:'نعم، ألغِ',c:'red',f:()=>{snap();c.dates.filter(d=>d.slice(0,7)===m).forEach(d=>{delete c.paid[d+'|'+s.id];if(c.pd)delete c.pd[d+'|'+s.id]});save();render()}}])}},{t:'إغلاق',c:'alt'}]);
    $('f1').onchange=info;info();return}
  else if(a==='inv'){invoice(c,c.students.find(x=>x.id===sid));return}
  else if(a==='sort'){S.order=S.order==='asc'?'desc':'asc'}
  else if(a==='zm'){S.size=Math.max(.7,+((S.size||1)-.1).toFixed(2))}
  else if(a==='zp'){S.size=Math.min(1.8,+((S.size||1)+.1).toFixed(2))}
  else if(a==='editcls'){modal('تعديل الصف','<label>اسم الصف</label><input id="f1" value="'+esc(c.name)+'">',[{t:'حفظ',f:()=>{const n=$('f1').value.trim();if(!n)return false;c.name=n;save();render()}},{t:'إلغاء',c:'alt'}]);return}
  else if(a==='att'){const k=d+'|'+sid,v=c.att[k];if(!v)c.att[k]='p';else if(v==='p')c.att[k]='a';else delete c.att[k]}
  else if(a==='pay'){const k=d+'|'+sid;if(c.paid[k]){modal('إلغاء الدفع','<p>إلغاء تعليم هذه الحصة كمدفوعة؟</p>',[{t:'لا',c:'alt'},{t:'نعم، ألغِ',c:'red',f:()=>{delete c.paid[k];if(c.pd)delete c.pd[k];save();render()}}]);return}c.paid[k]=1;c.pd=c.pd||{};c.pd[k]=today()}
  else if(a==='export'){modal('تصدير نسخة احتياطية','<p>احفظ الملف في «الملفات» أو iCloud Drive، أو أرسله لنفسك على واتساب أو البريد.</p><label>أو انسخ النص</label><textarea id="f1" readonly></textarea>',[{t:'حفظ كملف',f:()=>{dlFile();return false}},{t:'مشاركة',c:'alt',f:()=>{shareFile();return false}},{t:'نسخ النص',c:'alt',f:()=>{const ta=$('f1');ta.select();try{navigator.clipboard.writeText(ta.value);stamp()}catch(e){}return false}},{t:'إغلاق',c:'alt',f:()=>{render()}}]);$('f1').value=JSON.stringify(S);return}
  else if(a==='import'){modal('استيراد نسخة','<p>اختر ملف النسخة الاحتياطية أو الصق النص. سيحلّ محل البيانات الحالية (وتُحفظ نسخة من الحالية تلقائيًا).</p><input id="f4" type="file" accept=".json,application/json,text/plain"><label>أو الصق النص</label><textarea id="f1"></textarea>',[{t:'استيراد',f:()=>{const fl=$('f4').files[0];const go=txt=>{try{const j=JSON.parse(txt);if(!Array.isArray(j.classes))throw 0;lsSet('tt-prev',JSON.stringify(S));S=j;migrate();if(!S.cur&&S.classes[0])S.cur=S.classes[0].id;save();render();const o=document.querySelector('.ov');if(o)o.remove()}catch(e){alert('الملف غير صالح')}};if(fl){fl.text().then(go)}else go($('f1').value);return false}},{t:'إلغاء',c:'alt'}]);return}
  save();render();
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.m){S.month=e.target.value;save();render()}});
function migrate(){S.classes=S.classes||[];S.classes.forEach(c=>{c.students=c.students||[];c.dates=c.dates||[];['att','paid','pd','mult','notes','status'].forEach(k=>{c[k]=c[k]||{}});c.students.forEach(s=>{s.pays=s.pays||[]});Object.keys(c.paid).forEach(k=>{const[m,id]=k.split('|');if(m.length===7){c.dates.filter(d=>d.slice(0,7)===m).forEach(d=>{c.paid[d+'|'+id]=1});delete c.paid[k]}})})}
migrate();
if(!S.cur&&S.classes[0])S.cur=S.classes[0].id;
render();
</script>
</body>
