<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="سجل الدروس"><meta name="theme-color" content="#0b7d8a"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل الدروس الخصوصية</title>
<style>
:root{--bg:#f1f4f7;--card:#fff;--tx:#16212b;--mu:#6b7785;--ac:#0b7d8a;--ln:#e5e9ed;--ok:#dff3e8;--okt:#17794a;--no:#fde7e7;--not:#b3261e;--pd:#fff0c2;--pdt:#6a4f00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1115;--card:#151d23;--tx:#e9eff3;--mu:#8b9aa6;--ac:#43bfcb;--ln:#25323b;--ok:#17402f;--okt:#7be0a8;--no:#4a2326;--not:#ff9b94;--pd:#4f4012;--pdt:#ffe9a8}}
:root[data-theme="dark"]{--bg:#0b1115;--card:#151d23;--tx:#e9eff3;--mu:#8b9aa6;--ac:#43bfcb;--ln:#25323b;--ok:#17402f;--okt:#7be0a8;--no:#4a2326;--not:#ff9b94;--pd:#4f4012;--pdt:#ffe9a8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Arabic","SF Pro Text",system-ui,"Segoe UI",Tahoma,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
#app{max-width:560px;margin:0 auto;padding:10px max(12px,env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
h1{font-size:20px;margin:2px 2px 10px;font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;height:36px;padding:0 14px;border-radius:18px;background:var(--card);font-size:14px;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.tab.on{background:var(--ac);color:#fff;box-shadow:0 3px 10px rgba(11,125,138,.3)}
.tab.add{color:var(--ac);background:none;box-shadow:none;border:1px dashed var(--ln)}
.tb{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.tb .sm,select.mf{height:36px;padding:0 12px;border-radius:12px;background:var(--card);border:0;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.07)}
select.mf{flex:1;min-width:0}
.card{background:var(--card);border-radius:16px;padding:4px 14px 8px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0 4px}
.nm{background:none;font-weight:700;font-size:15px;padding:4px 0;text-align:start}
.ch>span{display:flex;gap:6px;align-items:center}
.r{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--ln)}
.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{width:62px;height:36px;border-radius:18px;background:var(--bg);color:var(--mu);font-size:13px;font-weight:700}
.st.p{background:var(--ok);color:var(--okt)}.st.a{background:var(--no);color:var(--not)}
.pay,.mx{height:36px;min-width:72px;padding:0 10px;border-radius:18px;border:1px solid var(--ln);font-size:13px;color:var(--mu)}
.pay.on{background:var(--ok);color:var(--okt);border-color:transparent;font-weight:700}
.mx{height:30px;min-width:0;font-size:12px}.mx.on{background:var(--pd);color:var(--pdt);border-color:transparent;font-weight:700}
.x{font-size:16px;width:34px;height:30px;border-radius:8px;color:var(--mu)}
.tag{font-size:12.5px;color:var(--mu)}
.stat{display:flex;gap:14px;flex-wrap:wrap;padding:2px 0 8px;font-size:14px;color:var(--mu)}.stat b{color:var(--tx)}
.due{color:var(--not);font-weight:700}.fine{color:var(--okt);font-weight:700}
.acts{display:flex;gap:6px;border-top:1px solid var(--ln);padding-top:8px}
.acts .sm{flex:1;height:36px;border-radius:10px;background:var(--bg);font-size:13.5px;font-weight:500}
.list button{display:block;width:100%;text-align:start;padding:13px 2px;font-size:15px;border-top:1px solid var(--ln)}
.list button:first-child{border-top:0}.list .rd{color:var(--not)}
.empty{color:var(--mu);text-align:center;padding:36px 10px}
.btn{min-height:44px;padding:0 18px;border-radius:12px;background:var(--ac);color:#fff;font-weight:700}
.btn.alt{background:var(--bg);color:var(--tx);font-weight:500}.btn.red{background:#c0392b}
.warn{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--pd);color:var(--pdt);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:13.5px}
.warn .btn{min-height:34px;padding:0 12px;font-size:13px}
.bar2{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.bar2 button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--mu);padding:4px 0}
.bar2 button i{font-style:normal;font-size:20px;line-height:1.2}.bar2 button.on{color:var(--ac);font-weight:700}
.fab{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:calc(76px + env(safe-area-inset-bottom));z-index:21;width:56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(11,125,138,.45)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.md{background:var(--card);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
.md h2{margin:0 0 10px;font-size:18px}
.md label{display:block;font-size:13.5px;color:var(--mu);margin:10px 0 4px}
.md input,.md select,.md textarea{width:100%;min-height:44px;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);font-size:16px}
.md textarea{height:140px;direction:ltr;font-size:12px}
.md .row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.md .row .btn{flex:1;min-width:104px}
.dt{display:flex;gap:6px}.dt select{flex:1;min-width:0}
.wrap{overflow:auto;border:1px solid var(--ln);border-radius:12px}
table{border-collapse:collapse;width:100%}th,td{padding:8px;text-align:center;border-bottom:1px solid var(--ln)}
td.ok{background:var(--ok)}td.no{background:var(--no)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media (min-width:600px){.ov{align-items:center;padding:16px}.md{border-radius:20px}}
@page{margin:0}
@media print{#app,.bar2,.fab{display:none}html,body{height:auto;overflow:visible;background:#fff!important}.ov{position:static;display:block;background:none;padding:0;overflow:visible}.md{max-width:none;max-height:none;overflow:visible;padding:16mm;background:#fff;color:#000;border-radius:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}.md .wrap{max-height:none!important;overflow:visible!important;border:0}.md th,.md td{background:#fff!important;color:#000!important}.md td.ok{background:#d6f1e1!important}.md td.no{background:#fbdada!important}.row,.md textarea,.md label{display:none}tr{break-inside:avoid}thead{display:table-header-group}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const K='tutor-tracker-v1';
let S={classes:[],cur:null};
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function save(){S.ts=Date.now();lsSet(K,JSON.stringify(S))}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const fileName=()=>'tutor-backup-'+today()+'.json';
const stamp=()=>lsSet('tt-lb',String(Date.now()));
function dlFile(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=fileName();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);stamp()}
async function shareFile(){const f=new File([JSON.stringify(S)],fileName(),{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});stamp()}catch(e){}}else dlFile()}
function bk(){if(!S.classes.length)return'';const t=+lsGet('tt-lb')||0,days=(Date.now()-t)/864e5;if(t&&days<7)return'';return`<div class="warn">${t?'مضى على آخر نسخة احتياطية '+Math.floor(days)+' أيام.':'لم تأخذ نسخة احتياطية بعد.'} <button class="btn" data-a="export">صدّر الآن</button></div>`}
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C=()=>S.classes.find(c=>c.id===S.cur);
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const fmt=d=>{const t=new Date(d+'T12:00:00');return DN[t.getDay()]+' '+t.getDate()+' '+MN[t.getMonth()]+' '+t.getFullYear()};
function dateForm(v){const[y,m,d]=v.split('-').map(Number);const yr=new Date().getFullYear();
let o='<div class="dt"><select id="d1" aria-label="اليوم">';for(let i=1;i<=31;i++)o+=`<option ${i===d?'selected':''}>${i}</option>`;
o+='</select><select id="d2" aria-label="الشهر">'+MN.map((n,i)=>`<option value="${i+1}" ${i+1===m?'selected':''}>${n}</option>`).join('')+'</select><select id="d3" aria-label="السنة">';
for(let i=yr-2;i<=yr+1;i++)o+=`<option ${i===y?'selected':''}>${i}</option>`;return o+'</select></div>'}
function getDate(){const d=+$('d1').value,m=+$('d2').value,y=+$('d3').value;const t=new Date(y,m-1,d);if(t.getMonth()!==m-1){alert('التاريخ غير صحيح');return null}return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function mfSel(c){const ms=[...new Set(c.dates.map(d=>d.slice(0,7)))].sort().reverse();if(!ms.length)return'';
return'<select class="mf" data-m="1" aria-label="الشهر"><option value="all">كل الأشهر</option>'+ms.map(m=>`<option value="${m}" ${S.month===m?'selected':''}>${MN[+m.slice(5)-1]} ${m.slice(0,4)}</option>`).join('')+'</select>'}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const $=id=>document.getElementById(id);

function stats(c,s,ds){
  let p=0,ab=0,n=0,amt=0;
  ds.forEach(d=>{const a=c.att[d+'|'+s.id];
    if(a==='p'){p++;const k=d+'|'+s.id;if(!c.paid[k]){n++;amt+=(+s.price||5)*(c.mult&&c.mult[d]===2?2:1)}}
    if(a==='a')ab++});
  return{p,ab,n,amt};
}

function invoice(c,s){
 const pr=+s.price||5,all=!S.month||S.month==='all';
 const ds=[...c.dates].filter(d=>all||d.slice(0,7)===S.month).sort().filter(d=>c.att[d+'|'+s.id]==='p');
 const per=all?'كل الفترة':MN[+S.month.slice(5)-1]+' '+S.month.slice(0,4);
 const isP=d=>!!c.paid[d+'|'+s.id];
 const pp=d=>pr*(c.mult&&c.mult[d]===2?2:1),f2=d=>fmt(d)+(c.mult&&c.mult[d]===2?' (ساعتان)':''),tot=ds.reduce((a,d)=>a+pp(d),0),pd=ds.filter(isP).reduce((a,d)=>a+pp(d),0),due=tot-pd;
 const txt=['فاتورة الدروس الخصوصية','الطالب: '+s.name,'الصف: '+c.name,'الفترة: '+per,'',...ds.map(d=>'• '+f2(d)+' — '+pr+' ر.ع — '+(isP(d)?'مدفوع':'غير مدفوع')),'','عدد الحصص: '+ds.length,'الإجمالي: '+tot+' ر.ع','المدفوع: '+pd+' ر.ع','المتبقي: '+due+' ر.ع'].join('\n');
 const tbl=ds.length?'<div class="wrap" style="zoom:1;max-height:34vh"><table><thead><tr><th>التاريخ</th><th>السعر</th><th>الحالة</th></tr></thead><tbody>'+ds.map(d=>`<tr><td>${f2(d)}</td><td>${pp(d)} ر.ع</td><td class="${isP(d)?'ok':'no'}">${isP(d)?'مدفوع':'غير مدفوع'}</td></tr>`).join('')+'</tbody></table></div>':'<p class="empty">لا توجد حصص حاضرة في هذه الفترة.</p>';
 const body=`<p><b>${esc(s.name)}</b><br><span style="color:var(--mu)">${esc(c.name)} · ${per}</span></p>${tbl}<p>عدد الحصص: <b>${ds.length}</b><br>الإجمالي: <b>${tot} ر.ع</b><br>المدفوع: <b>${pd} ر.ع</b><br>المتبقي: <b class="${due?'due':'fine'}">${due} ر.ع</b></p><label>نص جاهز للإرسال (واتساب)</label><textarea id="f1" readonly>${esc(txt)}</textarea>`;
 const img=async()=>{
 const W=900,rh=64,H=300+(ds.length+1)*rh+300;
 const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
 g.fillStyle='#fff';g.fillRect(0,0,W,H);g.direction='rtl';g.textBaseline='middle';
 const F='-apple-system,system-ui,sans-serif';
 const T=(x,y,tx,sz,col,al,w)=>{g.font=(w||'400')+' '+sz+'px '+F;g.fillStyle=col||'#12202b';g.textAlign=al||'right';g.fillText(tx,x,y)};
 T(W-50,70,'فاتورة الدروس الخصوصية',42,'#0e7c86','right','700');
 T(W-50,140,'الطالب: '+s.name,34,'','right','700');
 T(W-50,195,'الصف: '+c.name+' · '+per,28,'#5d6f7a');
 let y=250;g.fillStyle='#e6eef1';g.fillRect(40,y,W-80,rh);
 T(W-60,y+rh/2,'التاريخ',28,'','right','700');T(330,y+rh/2,'السعر',28,'','center','700');T(140,y+rh/2,'الحالة',28,'','center','700');
 y+=rh;
 ds.forEach(d=>{g.fillStyle=isP(d)?'#e3f5ea':'#fdeaea';g.fillRect(40,y,W-80,rh-4);const m=y+rh/2-2;
  T(W-60,m,f2(d),26);T(330,m,pp(d)+' ر.ع',26,'','center');T(140,m,isP(d)?'مدفوع':'غير مدفوع',26,'','center');y+=rh});
 y+=50;
 [['عدد الحصص: '+ds.length,'#12202b'],['الإجمالي: '+tot+' ر.ع','#12202b'],['المدفوع: '+pd+' ر.ع','#1f8a58'],['المتبقي: '+due+' ر.ع',due?'#c0392b':'#1f8a58']].forEach((r,i)=>{T(W-60,y+i*54,r[0],i===3?36:30,r[1],'right',i===3?'700':'400')});
 const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
 const f=new File([blob],'invoice-'+today()+'.png',{type:'image/png'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}
 else{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
};
 modal('فاتورة',body,[{t:'حفظ كصورة',f:()=>{img();return false}},{t:'نسخ النص',f:()=>{const ta=$('f1');ta.select();try{navigator.clipboard.writeText(txt)}catch(e){try{document.execCommand('copy')}catch(_){}}return false}},{t:'طباعة',c:'alt',f:()=>{window.print();return false}},{t:'إغلاق',c:'alt'}]);
}
let view='sessions';
function sess(c,ds){
 if(!c.students.length)return'<p class="empty">أضف طلاب هذا الصف أولًا.</p><div style="text-align:center"><button class="btn" data-a="addst">+ طالب</button></div>';
 if(!ds.length)return'<p class="empty">لا توجد حصص في هذه الفترة.</p><div style="text-align:center"><button class="btn" data-a="today">+ حصة اليوم</button></div>';
 return ds.map(d=>{const m2=c.mult&&c.mult[d]===2;
  return`<section class="card"><div class="ch"><button class="nm" data-a="editdate" data-d="${d}">${fmt(d)}</button><span><button class="mx ${m2?'on':''}" data-a="mult" data-d="${d}">${m2?'ساعتان ×٢':'ساعة'}</button><button class="x" data-a="deldate" data-d="${d}" aria-label="حذف الحصة">🗑</button></span></div>`+c.students.map(s=>{const a=c.att[d+'|'+s.id],p=c.paid[d+'|'+s.id],amt=(+s.price||5)*(m2?2:1);
   return`<div class="r"><span class="n">${esc(s.name)}</span><button class="st ${a||''}" data-a="att" data-d="${d}" data-s="${s.id}">${a==='p'?'حاضر':a==='a'?'غائب':'—'}</button><button class="pay ${p?'on':''}" data-a="pay" data-d="${d}" data-s="${s.id}">${p?'مدفوع ✓':amt+' ر.ع'}</button></div>`}).join('')+`</section>`}).join('');
}
function studs(c,ds){
 let h='<div class="tb"><button class="btn" data-a="addst">+ طالب</button></div>';
 if(!c.students.length)return h+'<p class="empty">لا يوجد طلاب في هذا الصف.</p>';
 return h+c.students.map(s=>{const t=stats(c,s,ds);
  return`<section class="card"><div class="ch"><button class="nm" data-a="editst" data-s="${s.id}">${esc(s.name)}</button><span class="tag">${s.type==='m'?'شهري':'بالحصة'} · ${+s.price||5} ر.ع</span></div><div class="stat"><span>حضر <b>${t.p}</b></span><span>غاب <b>${t.ab}</b></span><span class="${t.n?'due':'fine'}">${t.n?'مستحق '+t.amt+' ر.ع':'لا مستحقات'}</span></div><div class="acts"><button class="sm" data-a="pm" data-s="${s.id}">دفع شهر</button><button class="sm" data-a="inv" data-s="${s.id}">فاتورة</button><button class="sm" data-a="editst" data-s="${s.id}">تعديل</button></div></section>`}).join('');
}
function more(){return'<section class="card"><div class="list"><button data-a="export">📤 تصدير نسخة احتياطية</button><button data-a="import">📥 استيراد نسخة</button><button data-a="editcls">✏️ تعديل اسم الصف</button><button data-a="edittitle">🏷️ تعديل عنوان التطبيق</button><button class="rd" data-a="delcls">🗑 حذف الصف</button></div></section><p class="empty" style="padding:8px">اضغط على أي اسم أو تاريخ لتعديله.</p>'}
function render(){
 const c=C();
 let h=`<h1 data-a="edittitle">${esc(S.title||'سجل الدروس الخصوصية')}</h1>`+bk();
 h+='<nav class="tabs">'+S.classes.map(x=>`<button class="tab ${x.id===S.cur?'on':''}" data-a="cls" data-id="${x.id}">${esc(x.name)}</button>`).join('')+'<button class="tab add" data-a="addcls">+ صف</button></nav>';
 if(!c)h+='<p class="empty">أضف أول صف، مثل «الصف ١٢ – الأحد».</p>';
 else{
  const all=!S.month||S.month==='all';
  const ds=[...c.dates].filter(d=>all||d.slice(0,7)===S.month).sort();if(S.order!=='asc')ds.reverse();
  if(view==='more')h+=more();
  else{
   h+=`<div class="tb">${mfSel(c)}<button class="sm" data-a="sort">${S.order==='asc'?'الأقدم ↑':'الأحدث ↓'}</button></div>`;
   h+=view==='students'?studs(c,ds):sess(c,ds);
  }
  h+='<nav class="bar2">'+[['sessions','📅','الحصص'],['students','👥','الطلاب'],['more','⚙️','المزيد']].map(v=>`<button class="${view===v[0]?'on':''}" data-a="view" data-v="${v[0]}"><i>${v[1]}</i>${v[2]}</button>`).join('')+'</nav>';
  if(view==='sessions'&&c.students.length)h+='<button class="fab" data-a="adddate" aria-label="إضافة حصة">+</button>';
 }
 $('app').innerHTML=h;
}
function modal(title,body,btns){
  const o=document.createElement('div');o.className='ov';
  o.innerHTML=`<div class="md" role="dialog"><h2>${title}</h2>${body}<div class="row"></div></div>`;
  const row=o.querySelector('.row');
  btns.forEach(b=>{const e=document.createElement('button');e.className='btn '+(b.c||'');e.textContent=b.t;
    e.onclick=()=>{if(!b.f||b.f()!==false)o.remove()};row.appendChild(e)});
  o.addEventListener('click',e=>{if(e.target===o)o.remove()});
  document.body.appendChild(o);
  const i=o.querySelector('input,select,textarea');if(i)i.focus();
}
const stForm=s=>`<label>الاسم</label><input id="f1" value="${esc(s?s.name:'')}"><label>طريقة الدفع</label><select id="f2"><option value="s" ${s&&s.type==='s'?'selected':''}>بالحصة</option><option value="m" ${s&&s.type==='m'?'selected':''}>شهري</option></select><label>سعر الحصة بالريال (الافتراضي ٥)</label><input id="f3" type="number" min="0" step="0.5" value="${s&&s.price?s.price:''}">`;

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,c=C(),d=t.dataset.d,sid=t.dataset.s;
  if(a==='cls'){S.cur=t.dataset.id}
  else if(a==='addcls'){modal('صف جديد','<label>اسم الصف</label><input id="f1" placeholder="الصف ١٢ – الأحد">',[{t:'إضافة',f:()=>{const n=$('f1').value.trim();if(!n)return false;const x={id:uid(),name:n,students:[],dates:[],att:{},paid:{}};S.classes.push(x);S.cur=x.id;save();render()}},{t:'إلغاء',c:'alt'}]);return}
  else if(a==='delcls'){modal('حذف الصف',`<p>سيُحذف «${esc(c.name)}» مع كل طلابه وسجلاته. لا يمكن التراجع.</p>`,[{t:'حذف',c:'red',f:()=>{S.classes=S.classes.filter(x=>x.id!==c.id);S.cur=S.classes[0]?S.classes[0].id:null;save();render()}},{t:'إلغاء',c:'alt'}]);return}
  else if(a==='addst'){modal('طالب جديد',stForm(),[{t:'إضافة',f:()=>{const n=$('f1').value.trim();if(!n)return false;c.students.push({id:uid(),name:n,type:$('f2').value,price:$('f3').value});save();render()}},{t:'إلغاء',c:'alt'}]);return}
  else if(a==='editst'){const s=c.students.find(x=>x.id===sid);modal('تعديل الطالب',stForm(s),[{t:'حفظ',f:()=>{const n=$('f1').value.trim();if(!n)return false;s.name=n;s.type=$('f2').value;s.price=$('f3').value;save();render()}},{t:'حذف الطالب',c:'red',f:()=>{modal('تأكيد الحذف','<p>حذف «'+esc(s.name)+'» وكل سجلاته؟ لا يمكن التراجع.</p>',[{t:'إلغاء',c:'alt'},{t:'نعم، احذف',c:'red',f:()=>{c.students=c.students.filter(x=>x.id!==sid);save();render()}}])}},{t:'إلغاء',c:'alt'}]);return}
  else if(a==='adddate'){modal('حصة جديدة',`<label>تاريخ الحصة (يوم / شهر / سنة)</label>${dateForm(today())}<label>مدة الحصة</label><select id="f1"><option value="1">ساعة</option><option value="2">ساعتان (السعر ×٢)</option></select>`,[{t:'إضافة',f:()=>{const v=getDate();if(!v)return false;if(!c.dates.includes(v))c.dates.push(v);if($('f1').value==='2'){c.mult=c.mult||{};c.mult[v]=2}save();render()}},{t:'إلغاء',c:'alt'}]);return}
  else if(a==='deldate'){const n=c.students.filter(s=>c.att[d+'|'+s.id]||c.paid[d+'|'+s.id]).length;modal('تأكيد حذف الحصة','<p>سيتم حذف حصة <b>'+fmt(d)+'</b>'+(n?' مع سجلات '+n+' طلاب (حضور/دفع)':'')+'. لا يمكن التراجع.</p>',[{t:'إلغاء',c:'alt'},{t:'نعم، احذف الحصة',c:'red',f:()=>{c.dates=c.dates.filter(x=>x!==d);c.students.forEach(s=>{delete c.att[d+'|'+s.id];delete c.paid[d+'|'+s.id]});if(c.mult)delete c.mult[d];save();render()}}]);return}
  else if(a==='mult'){c.mult=c.mult||{};if(c.mult[d]===2)delete c.mult[d];else c.mult[d]=2}
  else if(a==='view'){view=t.dataset.v}
  else if(a==='edittitle'){modal('اسم التطبيق','<label>الاسم</label><input id="f1" value="'+esc(S.title||'سجل الدروس الخصوصية')+'">',[{t:'حفظ',f:()=>{S.title=$('f1').value.trim()||'سجل الدروس الخصوصية';save();render()}},{t:'إلغاء',c:'alt'}]);return}
  else if(a==='editdate'){modal('تعديل تاريخ الحصة','<label>التاريخ (يوم / شهر / سنة)</label>'+dateForm(d),[{t:'حفظ',f:()=>{const v=getDate();if(!v)return false;if(v!==d){if(c.dates.includes(v)){alert('توجد حصة بهذا التاريخ');return false}c.dates=c.dates.map(x=>x===d?v:x);c.students.forEach(s=>{['att','paid'].forEach(k=>{const o=s.id;if(c[k][d+'|'+o]!==undefined){c[k][v+'|'+o]=c[k][d+'|'+o];delete c[k][d+'|'+o]}})});if(c.mult&&c.mult[d]){c.mult[v]=c.mult[d];delete c.mult[d]}}save();render()}},{t:'إلغاء',c:'alt'}]);return}
  else if(a==='today'){const v=today();if(!c.dates.includes(v))c.dates.push(v);save();render()}
  else if(a==='pm'){const s=c.students.find(x=>x.id===sid);const ms=[...new Set(c.dates.map(d=>d.slice(0,7)))].sort().reverse();
    if(!ms.length){modal('دفع شهر','<p class="empty">لا توجد حصص بعد.</p>',[{t:'إغلاق',c:'alt'}]);return}
    const sel=S.month&&ms.includes(S.month)?S.month:ms[0];
    const info=()=>{const m=$('f1').value;const ds=c.dates.filter(d=>d.slice(0,7)===m&&c.att[d+'|'+s.id]==='p');const un=ds.filter(d=>!c.paid[d+'|'+s.id]);const pr=+s.price||5;const amt=un.reduce((a,d)=>a+pr*(c.mult&&c.mult[d]===2?2:1),0);$('pmi').textContent='حصص حضرها: '+ds.length+' · غير مدفوعة: '+un.length+' · المبلغ: '+amt+' ر.ع'};
    modal('دفع شهر كامل — '+esc(s.name),'<label>الشهر</label><select id="f1">'+ms.map(m=>'<option value="'+m+'"'+(m===sel?' selected':'')+'>'+MN[+m.slice(5)-1]+' '+m.slice(0,4)+'</option>').join('')+'</select><p id="pmi"></p><p style="color:var(--mu);font-size:13px">يُعلَّم فقط ما حضره الطالب من حصص ذلك الشهر.</p>',[{t:'تعليم الشهر مدفوعًا',f:()=>{const m=$('f1').value;c.dates.filter(d=>d.slice(0,7)===m&&c.att[d+'|'+s.id]==='p').forEach(d=>{c.paid[d+'|'+s.id]=1});save();render()}},{t:'إلغاء الدفع للشهر',c:'alt',f:()=>{const m=$('f1').value;c.dates.filter(d=>d.slice(0,7)===m).forEach(d=>{delete c.paid[d+'|'+s.id]});save();render()}},{t:'إغلاق',c:'alt'}]);
    $('f1').onchange=info;info();return}
  else if(a==='inv'){invoice(c,c.students.find(x=>x.id===sid));return}
  else if(a==='sort'){S.order=S.order==='asc'?'desc':'asc'}
  else if(a==='zm'){S.size=Math.max(.7,+((S.size||1)-.1).toFixed(2))}
  else if(a==='zp'){S.size=Math.min(1.8,+((S.size||1)+.1).toFixed(2))}
  else if(a==='editcls'){modal('تعديل الصف','<label>اسم الصف</label><input id="f1" value="'+esc(c.name)+'">',[{t:'حفظ',f:()=>{const n=$('f1').value.trim();if(!n)return false;c.name=n;save();render()}},{t:'إلغاء',c:'alt'}]);return}
  else if(a==='att'){const k=d+'|'+sid,v=c.att[k];if(!v)c.att[k]='p';else if(v==='p')c.att[k]='a';else delete c.att[k]}
  else if(a==='pay'){const s=c.students.find(x=>x.id===sid);const k=d+'|'+sid;if(c.paid[k])delete c.paid[k];else c.paid[k]=1}
  else if(a==='export'){modal('تصدير نسخة احتياطية','<p>احفظ الملف في «الملفات» أو iCloud Drive، أو أرسله لنفسك على واتساب أو البريد.</p><label>أو انسخ النص</label><textarea id="f1" readonly></textarea>',[{t:'حفظ كملف',f:()=>{dlFile();return false}},{t:'مشاركة',c:'alt',f:()=>{shareFile();return false}},{t:'نسخ النص',c:'alt',f:()=>{const ta=$('f1');ta.select();try{navigator.clipboard.writeText(ta.value);stamp()}catch(e){}return false}},{t:'إغلاق',c:'alt',f:()=>{render()}}]);$('f1').value=JSON.stringify(S);return}
  else if(a==='import'){modal('استيراد نسخة','<p>اختر ملف النسخة الاحتياطية أو الصق النص. سيحلّ محل البيانات الحالية (وتُحفظ نسخة من الحالية تلقائيًا).</p><input id="f4" type="file" accept=".json,application/json,text/plain"><label>أو الصق النص</label><textarea id="f1"></textarea>',[{t:'استيراد',f:()=>{const fl=$('f4').files[0];const go=txt=>{try{const j=JSON.parse(txt);if(!Array.isArray(j.classes))throw 0;lsSet('tt-prev',JSON.stringify(S));S=j;migrate();if(!S.cur&&S.classes[0])S.cur=S.classes[0].id;save();render();const o=document.querySelector('.ov');if(o)o.remove()}catch(e){alert('الملف غير صالح')}};if(fl){fl.text().then(go)}else go($('f1').value);return false}},{t:'إلغاء',c:'alt'}]);return}
  save();render();
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.m){S.month=e.target.value;save();render()}});
function migrate(){S.classes.forEach(c=>{Object.keys(c.paid).forEach(k=>{const[m,id]=k.split('|');if(m.length===7){c.dates.filter(d=>d.slice(0,7)===m).forEach(d=>{c.paid[d+'|'+id]=1});delete c.paid[k]}})})}
migrate();
if(!S.cur&&S.classes[0])S.cur=S.classes[0].id;
render();
</script>
