<style>

.btn{min-height:44px;padding:0 18px;border-radius:12px;background:var(--ac);color:#fff;font-weight:700}
.btn.alt{background:var(--bg);color:var(--tx);font-weight:500}.btn.red{background:#c0392b}

.bar2{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}

.md .row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.md .row .btn{flex:1;min-width:104px}
.dt{display:flex;gap:6px}.dt select{flex:1;min-width:0}
.wrap{overflow:auto;border:1px solid var(--ln);border-radius:12px}
table{border-collapse:collapse;width:100%}th,td{padding:8px;text-align:center;border-bottom:1px solid var(--ln)}
td.ok{background:var(--ok)}td.no{background:var(--no)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

@page{margin:0}
@media print{#app,.bar2,.fab{display:none}html,body{height:auto;overflow:visible;background:#fff!important}.ov{position:static;display:block;background:none;padding:0;overflow:visible}.md{max-width:none;max-height:none;overflow:visible;padding:16mm;background:#fff;color:#000;border-radius:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}.md .wrap{max-height:none!important;overflow:visible!important;border:0}.md th,.md td{background:#fff!important;color:#000!important}.md td.ok{background:#d6f1e1!important}.md td.no{background:#fbdada!important}.row,.md textarea,.md label,.md select{display:none}.md .im,.md small{color:#333!important}.md .sum .tt{background:none}tr{break-inside:avoid}thead{display:table-header-group}}
.ih{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ac);padding-bottom:8px;margin-bottom:6px}.ih b{font-size:20px;color:var(--ac)}.ih span{color:var(--mu);font-size:13px}
.im{font-size:13.5px;color:var(--mu);margin:6px 0;line-height:1.7}
.sum{margin-top:10px}.sum div{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--ln)}.sum .tt{font-size:17px;font-weight:700;background:var(--bg);padding:9px 8px;border-radius:8px;border:0}
.stamp{margin:12px auto 0;width:max-content;border:3px solid var(--okt);color:var(--okt);font-weight:700;padding:4px 16px;border-radius:10px;transform:rotate(-4deg)}
.nt{font-size:13px;color:var(--mu);padding:0 0 6px}
th small,td small{color:var(--mu);font-size:11.5px}
.card.off{opacity:.55}.bd{font-size:11.5px;padding:2px 8px;border-radius:10px;background:var(--pd);color:var(--pdt);margin-inline-start:8px}.bd.x{background:var(--no);color:var(--not)}
:root{color-scheme:light dark}
.hero{background:linear-gradient(135deg,#0b7d8a,#14a0a6);color:#fff;border-radius:20px;padding:14px 16px;margin:2px 0 12px;box-shadow:0 8px 22px rgba(11,125,138,.28)}
.hero h1{margin:0;font-size:21px;color:#fff}.hero p{margin:2px 0 0;font-size:13px;opacity:.85}
@media (prefers-color-scheme:dark){.hero{background:linear-gradient(135deg,#0f5b66,#137a82)}}
button{transition:transform .12s ease,background-color .2s ease}button:active{transform:scale(.96)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{animation:fadeUp .28s ease both}
.av{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;color:#fff;font-style:normal;font-weight:700;font-size:14px;flex:none}
.a0{background:#0b7d8a}.a1{background:#6a5acd}.a2{background:#d9822b}.a3{background:#c0568a}.a4{background:#3f9d5a}.a5{background:#4a7bd0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px}.tab.on .dot{box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.who{display:flex;align-items:center;gap:8px}
.pb{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;margin:2px 0 8px}.pb i{display:block;height:100%;background:linear-gradient(90deg,#0b7d8a,#3f9d5a);border-radius:3px;transition:width .4s ease}
.ch>.sp{display:flex;gap:6px;align-items:center;margin-inline-start:auto}
.allp{display:block;width:100%;margin-top:4px;padding:9px;border-radius:10px;background:var(--bg);color:var(--mu);font-size:13px;border-top:1px solid var(--ln)}
.alertb{display:flex;flex-direction:column;gap:2px;width:100%;text-align:start;background:var(--pd);color:var(--pdt);border-radius:14px;padding:10px 14px;margin-bottom:10px;font-size:13px}.alertb b{font-size:14px}
.sumcard{background:linear-gradient(135deg,var(--card),var(--bg))}
.md .chk{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px}.md .chk input{width:auto;min-height:0}
.inv{border:1px solid var(--ln);border-radius:14px;padding:0 12px 12px;margin:8px 0;overflow:hidden}
.ih{margin:0 -12px 8px!important;padding:12px!important;background:var(--ac);border:0!important;border-radius:0;color:#fff}.ih b,.ih span{color:#fff!important}
.nl{margin:8px 0 0;padding-inline-start:18px;font-size:13px;color:var(--mu);line-height:1.7}
@media print{.ictl{display:none}.md .ih{background:#0e7c86!important;color:#fff!important}.md .ih b,.md .ih span{color:#fff!important}.md .nl{color:#333}.md .inv{border-color:#ccc}}
.tb{flex-wrap:wrap}.tb select.mf{min-width:120px}
.acts{flex-wrap:wrap}.acts .sm{flex:1 1 calc(33% - 6px)}
.card.tod{box-shadow:0 0 0 2px var(--ac),0 1px 3px rgba(0,0,0,.06)}
.flash{animation:flash 1.2s ease}@keyframes flash{0%,60%{box-shadow:0 0 0 4px rgba(11,125,138,.55)}100%{box-shadow:none}}
.dsm{height:34px;padding:0 14px;border-radius:10px;background:var(--bg);font-size:13.5px;font-weight:500}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;background:#1f2a33;color:#fff;border-radius:22px;padding:6px 8px 6px 16px;display:flex;align-items:center;gap:14px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:fadeUp .2s ease both}
#toast button{background:rgba(255,255,255,.16);color:#fff;border-radius:16px;padding:6px 14px;font-weight:700}
@media print{#toast{display:none}}
</style>

<body>
<div id="app"></div>
<script>
const K='tutor-tracker-v1';
let S={classes:[],cur:null};
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function save(){S.ts=Date.now();lsSet(K,JSON.stringify(S))}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const fileName=()=>'tutor-backup-'+today()+'.json';
const stamp=()=>lsSet('tt-lb',String(Date.now()));
function dlFile(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=fileName();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);stamp()}
async function shareFile(){const f=new File([JSON.stringify(S)],fileName(),{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});stamp()}catch(e){}}else dlFile()}
function csvText(){const rows=[['الصف','الطالب','النوع','التاريخ','المدة','الحضور','المبلغ','حالة الدفع','تاريخ الدفع','ملاحظة']];
 S.classes.forEach(c=>{c.dates.slice().sort().forEach(d=>{c.students.forEach(s=>{const a=c.att[d+'|'+s.id],k=d+'|'+s.id;if(!a&&!c.paid[k])return;const m2=c.mult&&c.mult[d]===2;rows.push([c.name,s.name,'حصة',d,m2?'ساعتان':'ساعة',a==='p'?'حاضر':a==='a'?'غائب':'',(+s.price||5)*(m2?2:1),c.paid[k]?'مدفوع':'',(c.pd&&c.pd[k])||'',(c.notes&&c.notes[d])||''])})});
  c.students.forEach(s=>(s.pays||[]).forEach(p=>rows.push([c.name,s.name,'دفعة',p.date||'','','',p.amt,'',p.date||'',p.note||''])))});
 return'\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n')}
async function shareBlob(name,txt,type){const f=new File([txt],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}else{const u=URL.createObjectURL(new Blob([txt],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}}
function bk(){if(!S.classes.length)return'';const t=+lsGet('tt-lb')||0,days=(Date.now()-t)/864e5;if(t&&days<7)return'';return`<div class="warn">${t?'مضى على آخر نسخة احتياطية '+Math.floor(days)+' أيام.':'لم تأخذ نسخة احتياطية بعد.'} <button class="btn" data-a="export">صدّر الآن</button></div>`}
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C=()=>S.classes.find(c=>c.id===S.cur);
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const fmt=d=>{const t=new Date(d+'T12:00:00');return DN[t.getDay()]+' '+t.getDate()+' '+MN[t.getMonth()]+' '+t.getFullYear()};
function dateForm(v,p){p=p||'d';const[y,m,d]=v.split('-').map(Number);const yr=new Date().getFullYear();
let o='<div class="dt"><select id="'+p+'1" aria-label="اليوم">';for(let i=1;i<=31;i++)o+=`<option ${i===d?'selected':''}>${i}</option>`;
o+='</select><select id="'+p+'2" aria-label="الشهر">'+MN.map((n,i)=>`<option value="${i+1}" ${i+1===m?'selected':''}>${n}</option>`).join('')+'</select><select id="'+p+'3" aria-label="السنة">';
for(let i=Math.min(yr-2,y);i<=Math.max(yr+1,y);i++)o+=`<option ${i===y?'selected':''}>${i}</option>`;return o+'</select></div>'}
function getDate(p,q){p=p||'d';const d=+$(p+'1').value,m=+$(p+'2').value,y=+$(p+'3').value;const t=new Date(y,m-1,d);if(t.getMonth()!==m-1){if(!q)alert('التاريخ غير صحيح');return null}return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function mfSel(c){const ms=[...new Set(c.dates.map(d=>d.slice(0,7)))].sort().reverse();if(!ms.length)return'';
return'<select class="mf" data-m="1" aria-label="الشهر"><option value="all">كل الأشهر</option>'+ms.map(m=>`<option value="${m}" ${S.month===m?'selected':''}>${MN[+m.slice(5)-1]} ${m.slice(0,4)}</option>`).join('')+'</select>'}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const $=id=>document.getElementById(id);

const R3=x=>Math.round(x*1000)/1000;
const fd=d=>{const t=new Date(d+'T12:00:00');return t.getDate()+' '+MN[t.getMonth()]+' '+t.getFullYear()};
const snap=()=>lsSet('tt-prev',JSON.stringify(S));
function alloc(c,s,end,exp){
 const pr=+s.price||5,td=today();
 let credit=R3((s.pays||[]).filter(p=>!p.date||p.date<=end).reduce((a,p)=>a+(+p.amt||0),0));
 const rows=c.dates.filter(d=>d<=end&&!(c.status&&c.status[d]==='x')).sort().map(d=>{const a=c.att[d+'|'+s.id];
  if(a!=='p'&&!(exp&&!a&&d>=td))return null;
  const cost=pr*(c.mult&&c.mult[d]===2?2:1),flag=!!c.paid[d+'|'+s.id];return{d,cost,flag,cov:0,rem:flag?0:cost,exp:a!=='p'}}).filter(Boolean);
 rows.forEach(r=>{if(!r.flag&&credit>0){const u=Math.min(credit,r.cost);r.cov=u;r.rem=R3(r.cost-u);credit=R3(credit-u)}});
 return{rows,adv:credit,due:R3(rows.reduce((a,r)=>a+r.rem,0))};
}
function stats(c,s,ds){
 let p=0,ab=0;ds.forEach(d=>{if(c.status&&c.status[d]==='x')return;const a=c.att[d+'|'+s.id];if(a==='p')p++;if(a==='a')ab++});
 const a=alloc(c,s,'9999-12-31');
 return{p,ab,n:a.rows.filter(r=>r.rem>0).length,amt:a.due,adv:a.adv};
}
function payEvents(c,s){
 const pr=+s.price||5,ev=(s.pays||[]).map(p=>({date:p.date||'',amt:+p.amt||0,note:p.note||'',n:0}));
 const g={};c.dates.forEach(d=>{const k=d+'|'+s.id;if(c.paid[k]){const dt=(c.pd&&c.pd[k])||'';g[dt]=g[dt]||{date:dt,amt:0,note:'',n:0};g[dt].amt+=pr*(c.mult&&c.mult[d]===2?2:1);g[dt].n++}});
 return ev.concat(Object.values(g)).filter(e=>e.amt>0).sort((a,b)=>a.date.localeCompare(b.date));
}
const lastPay=(c,s)=>{const e=payEvents(c,s).filter(x=>x.date);return e.length?e[e.length-1]:null};
const avc=n=>[...String(n)].reduce((a,ch)=>a+ch.charCodeAt(0),0)%6;
const av=n=>`<i class="av a${avc(n)}">${esc([...String(n).trim()][0]||'؟')}</i>`;
function paysModal(c,s){

  else if(a==='editpay'){const s=c.students.find(x=>x.id===sid),p=s&&(s.pays||[]).find(x=>x.id===t.dataset.p);if(!p)return;document.querySelectorAll('.ov').forEach(o=>o.remove());modal('تعديل دفعة','<label>المبلغ (ر.ع)</label><input id="f1" type="number" inputmode="decimal" step="0.5" value="'+p.amt+'"><label>تاريخ الدفع</label>'+dateForm(p.date||today())+'<label>ملاحظة</label><input id="f2" value="'+esc(p.note||'')+'">',[{t:'حفظ',f:()=>{const amt=+$('f1').value;if(!(amt>0)){alert('أدخل مبلغًا صحيحًا');return false}const dv=getDate();if(!dv)return false;p.amt=R3(amt);p.date=dv;p.note=$('f2').value.trim();save();render();paysModal(c,s)}},{t:'رجوع',c:'alt',f:()=>{paysModal(c,s)}}]);return}
  else if(a==='allp'){c.students.filter(s=>!s.arch).forEach(s=>{if(!c.att[d+'|'+s.id])c.att[d+'|'+s.id]='p'})}
  else if(a==='csv'){shareBlob('tutor-data-'+today()+'.csv',csvText(),'text/csv');return}
  else if(a==='invlog'){const L=(S.invlog||[]).slice().reverse();modal('سجل الفواتير الصادرة',L.length?L.map(e=>'<div class="r"><span class="n"><b>#'+e.n+'</b> · '+fd(e.day)+' · '+esc(e.sname)+'<br><span class="tag">'+esc(e.title)+' — '+esc(e.label)+'</span></span><b class="'+(e.due?'due':'fine')+'">'+(e.due?e.due+' ر.ع':'مسدّد')+'</b></div>').join(''):'<p class="empty" style="padding:14px">لم تُصدر فواتير بعد. تُسجَّل الفاتورة تلقائيًا عند الإرسال أو الحفظ أو النسخ.</p>',[{t:'إغلاق',c:'alt'}]);return}
  else if(a==='editgreet'){modal('افتتاحية الرسالة','<label>تُكتب في أول كل رسالة واتساب (اتركها فارغة لحذفها)</label><input id="f1" value="'+esc(S.greet===undefined?'السلام عليكم ورحمة الله،':S.greet)+'">',[{t:'حفظ',f:()=>{S.greet=$('f1').value.trim();save();render()}},{t:'إلغاء',c:'alt'}]);return}
  else if(a==='dues'){duesModal();return}
  else if(a==='invx'){const c2=S.classes.find(x=>x.id===t.dataset.c),s2=c2&&c2.students.find(x=>x.id===sid);if(!s2)return;document.querySelectorAll('.ov').forEach(o=>o.remove());invoice(c2,s2);return}
  else if(a==='hist'){histModal(c,c.students.find(x=>x.id===sid));return}
  else if(a==='report'){reportModal();return}
  else if(a==='jump'){const cards=[...document.querySelectorAll('[data-day]')];if(!cards.length)return;const td=new Date(today()+'T12:00:00');let best=cards[0],bd=1e18;cards.forEach(x=>{const dd=Math.abs(new Date(x.dataset.day+'T12:00:00')-td);if(dd<bd){bd=dd;best=x}});best.scrollIntoView({behavior:'smooth',block:'center'});best.classList.add('flash');setTimeout(()=>best.classList.remove('flash'),1400);return}
  else if(a==='view'){view=t.dataset.v;fresh=true}
  else if(a==='edittitle'){modal('اسم التطبيق','<label>الاسم</label><input id="f1" value="'+esc(S.title||'سجل الدروس الخصوصية')+'">',[{t:'حفظ',f:()=>{S.title=$('f1').value.trim()||'سجل الدروس الخصوصية';save();render()}},{t:'إلغاء',c:'alt'}]);return}
  else if(a==='editdate'){modal('تعديل تاريخ الحصة','<label>التاريخ (يوم / شهر / سنة)</label>'+dateForm(d),[{t:'حفظ',f:()=>{const v=getDate();if(!v)return false;if(v!==d){if(c.dates.includes(v)){alert('توجد حصة بهذا التاريخ');return false}c.dates=c.dates.map(x=>x===d?v:x);c.students.forEach(s=>{['att','paid','pd'].forEach(k=>{const o=s.id;if(c[k]&&c[k][d+'|'+o]!==undefined){c[k][v+'|'+o]=c[k][d+'|'+o];delete c[k][d+'|'+o]}})});if(c.mult&&c.mult[d]){c.mult[v]=c.mult[d];delete c.mult[d]}if(c.notes&&c.notes[d]){c.notes[v]=c.notes[d];delete c.notes[d]}if(c.status&&c.status[d]){c.status[v]=c.status[d];delete c.status[d]}}save();render()}},{t:'إلغاء',c:'alt'}]);return}
  else if(a==='today'){const v=today();if(!c.dates.includes(v))c.dates.push(v);save();render()}
  else if(a==='pm'){const s=c.students.find(x=>x.id===sid);const ms=[...new Set(c.dates.map(d=>d.slice(0,7)))].sort().reverse();
    if(!ms.length){modal('دفع شهر','<p class="empty">لا توجد حصص بعد.</p>',[{t:'إغلاق',c:'alt'}]);return}
    const sel=S.month&&ms.includes(S.month)?S.month:ms[0];
    const info=()=>{const m=$('f1').value;const ds=c.dates.filter(d=>d.slice(0,7)===m&&c.att[d+'|'+s.id]==='p');const un=ds.filter(d=>!c.paid[d+'|'+s.id]);const pr=+s.price||5;const amt=un.reduce((a,d)=>a+pr*(c.mult&&c.mult[d]===2?2:1),0);$('pmi').textContent='حصص حضرها: '+ds.length+' · غير مدفوعة: '+un.length+' · المبلغ: '+amt+' ر.ع'};
    modal('دفع شهر كامل — '+esc(s.name),'<label>الشهر</label><select id="f1">'+ms.map(m=>'<option value="'+m+'"'+(m===sel?' selected':'')+'>'+MN[+m.slice(5)-1]+' '+m.slice(0,4)+'</option>').join('')+'</select><p id="pmi"></p><label>تاريخ الدفع</label>'+dateForm(today())+'<p style="color:var(--mu);font-size:13px">يُعلَّم فقط ما حضره الطالب من حصص ذلك الشهر.</p>',[{t:'تعليم الشهر مدفوعًا',f:()=>{const m=$('f1').value;const dv=getDate();if(!dv)return false;c.pd=c.pd||{};c.dates.filter(d=>d.slice(0,7)===m&&c.att[d+'|'+s.id]==='p').forEach(d=>{c.paid[d+'|'+s.id]=1;if(!c.pd[d+'|'+s.id])c.pd[d+'|'+s.id]=dv});save();render()}},{t:'إلغاء الدفع للشهر',c:'alt',f:()=>{const m=$('f1').value;modal('تأكيد','<p>إلغاء تعليم الدفع لكل حصص هذا الشهر لـ '+esc(s.name)+'؟</p>',[{t:'لا',c:'alt'},{t:'نعم، ألغِ',c:'red',f:()=>{snap();c.dates.filter(d=>d.slice(0,7)===m).forEach(d=>{delete c.paid[d+'|'+s.id];if(c.pd)delete c.pd[d+'|'+s.id]});save();render()}}])}},{t:'إغلاق',c:'alt'}]);
    $('f1').onchange=info;info();return}
  else if(a==='inv'){invoice(c,c.students.find(x=>x.id===sid));return}
  else if(a==='sort'){S.order=S.order==='asc'?'desc':'asc'}
  else if(a==='zm'){S.size=Math.max(.7,+((S.size||1)-.1).toFixed(2))}
  else if(a==='zp'){S.size=Math.min(1.8,+((S.size||1)+.1).toFixed(2))}
  else if(a==='editcls'){modal('تعديل الصف','<label>اسم الصف</label><input id="f1" value="'+esc(c.name)+'">',[{t:'حفظ',f:()=>{const n=$('f1').value.trim();if(!n)return false;c.name=n;save();render()}},{t:'إلغاء',c:'alt'}]);return}
  else if(a==='att'){const k=d+'|'+sid,v=c.att[k];if(!v)c.att[k]='p';else if(v==='p')c.att[k]='a';else delete c.att[k]}
  else if(a==='pay'){const k=d+'|'+sid,s=c.students.find(x=>x.id===sid);
    if(c.paid[k]){modal('الدفع — '+fmt(d),'<p>تاريخ الدفع المسجّل: <b>'+((c.pd&&c.pd[k])?fd(c.pd[k]):'غير مسجّل')+'</b></p><label>تغيير تاريخ الدفع</label>'+dateForm((c.pd&&c.pd[k])||today()),[{t:'حفظ التاريخ',f:()=>{const v=getDate();if(!v)return false;c.pd=c.pd||{};c.pd[k]=v;save();render()}},{t:'إلغاء الدفع',c:'red',f:()=>{modal('إلغاء الدفع','<p>إلغاء تعليم هذه الحصة كمدفوعة؟</p>',[{t:'لا',c:'alt'},{t:'نعم، ألغِ',c:'red',f:()=>{snap();delete c.paid[k];if(c.pd)delete c.pd[k];save();render()}}])}},{t:'إغلاق',c:'alt'}]);return}
    const r=alloc(c,s,'9999-12-31').rows.find(x=>x.d===d);
    if(r&&r.cov>0){modal('الحصة مغطّاة بدفعة','<p>هذه الحصة مغطّاة (كليًا أو جزئيًا) من دفعة مسجّلة. لتعديل المبالغ أو التواريخ افتح «دفعات» الطالب. ولا داعي لتعليمها مدفوعة، حتى لا يُحسب الدفع مرتين.</p>',[{t:'دفعات الطالب',f:()=>{setTimeout(()=>paysModal(c,s),0)}},{t:'تعليمها مدفوعة يدويًا',c:'alt',f:()=>{c.paid[k]=1;c.pd=c.pd||{};c.pd[k]=today();save();render()}},{t:'إغلاق',c:'alt'}]);return}
    c.paid[k]=1;c.pd=c.pd||{};c.pd[k]=today()}
  else if(a==='export'){modal('تصدير نسخة احتياطية','<p>احفظ الملف في «الملفات» أو iCloud Drive، أو أرسله لنفسك على واتساب أو البريد.</p><label>أو انسخ النص</label><textarea id="f1" readonly></textarea>',[{t:'حفظ كملف',f:()=>{dlFile();return false}},{t:'مشاركة',c:'alt',f:()=>{shareFile();return false}},{t:'نسخ النص',c:'alt',f:()=>{const ta=$('f1');ta.select();try{navigator.clipboard.writeText(ta.value);stamp()}catch(e){}return false}},{t:'إغلاق',c:'alt',f:()=>{render()}}]);$('f1').value=JSON.stringify(S);return}
  else if(a==='import'){modal('استيراد نسخة','<p>اختر ملف النسخة الاحتياطية أو الصق النص. سيحلّ محل البيانات الحالية (وتُحفظ نسخة من الحالية تلقائيًا).</p><input id="f4" type="file" accept=".json,application/json,text/plain"><label>أو الصق النص</label><textarea id="f1"></textarea>',[{t:'استيراد',f:()=>{const fl=$('f4').files[0];const go=txt=>{try{const j=JSON.parse(txt);if(!Array.isArray(j.classes))throw 0;lsSet('tt-prev',JSON.stringify(S));S=j;migrate();if(!S.cur&&S.classes[0])S.cur=S.classes[0].id;save();render();const o=document.querySelector('.ov');if(o)o.remove()}catch(e){alert('الملف غير صالح')}};if(fl){fl.text().then(go)}else go($('f1').value);return false}},{t:'إلغاء',c:'alt'}]);return}
  save();render();if(before)toast(before);
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.m){S.month=e.target.value;save();render()}});
function migrate(){S.classes=S.classes||[];S.classes.forEach(c=>{c.students=c.students||[];c.dates=c.dates||[];['att','paid','pd','mult','notes','status'].forEach(k=>{c[k]=c[k]||{}});c.students.forEach(s=>{s.pays=s.pays||[]});Object.keys(c.paid).forEach(k=>{const[m,id]=k.split('|');if(m.length===7){c.dates.filter(d=>d.slice(0,7)===m).forEach(d=>{c.paid[d+'|'+id]=1});delete c.paid[k]}})})}
migrate();
if(!S.cur&&S.classes[0])S.cur=S.classes[0].id;
render();
</script>
